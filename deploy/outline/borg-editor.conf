map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 3000;
    client_max_body_size 100m;
    location / {
        proxy_pass http://outline:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_hide_header X-Frame-Options;
        # Keep Outline's existing CSP. This additional policy restricts who may embed it.
        add_header Content-Security-Policy "frame-ancestors 'self' https://borg.cyborglab.org http://localhost:5173 http://localhost:5174 http://127.0.0.1:5173 http://127.0.0.1:5174" always;
    }
}
